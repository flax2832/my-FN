<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>牙齿保卫战 - 云南白药</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#1a1a2e}
#app{width:375px;height:812px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);overflow:hidden;background:#fff}
.scene{position:absolute;inset:0;display:none;overflow:hidden;background:#fff}
.scene.active{display:flex;flex-direction:column;align-items:center}
.diagonal-enter{animation:diagonalIn .6s cubic-bezier(.4,0,.2,1) forwards}
.diagonal-exit{animation:diagonalOut .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes diagonalIn{0%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
@keyframes diagonalOut{0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}100%{clip-path:polygon(0 0,0 0,0 100%,0 100%)}}
.scene-text{font-size:18px;color:#555;line-height:1.6;margin-bottom:16px;text-align:center;padding:0 20px}
.hidden{display:none!important}
.action-hint{position:absolute;bottom:30px;font-size:14px;color:#bbb;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.4}50%{opacity:1}}

.tutorial-step{padding:30px;text-align:center}
.tutorial-step h2{font-size:24px;color:#333;margin-bottom:20px;font-weight:900}
.tutorial-lanes{display:flex;gap:30px;justify-content:center;margin:20px 0}
.tutorial-lane{width:60px;display:flex;flex-direction:column;align-items:center}
.lane-dot{width:16px;height:16px;border-radius:50%;margin:4px 0}
.lane-dot.yellow{background:#F5C842}
.lane-dot.purple{background:#9B59B6}
.lane-dot.black{background:#2C3E50}
.lane-arrow{font-size:20px;color:#999;margin:4px 0}
.tutorial-legend{display:flex;gap:20px;margin:16px 0;font-size:14px;color:#666;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-swatch{width:14px;height:14px;border-radius:50%;display:inline-block}
.start-btn{display:inline-block;padding:14px 48px;background:linear-gradient(135deg,#4FC3F7,#29B6F6);color:#fff;font-size:20px;font-weight:bold;border:none;border-radius:28px;cursor:pointer;box-shadow:0 4px 15px rgba(79,195,247,.4);transition:transform .2s;margin-top:20px}
.start-btn:active{transform:scale(.95)}

#game-wrapper{position:absolute;inset:0;background:#f0f4f8}
#gameCanvas{position:absolute;top:50px;left:0;width:375px;height:550px;touch-action:none;z-index:1}
#game-hud{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;padding:0 12px;gap:8px;background:linear-gradient(180deg,#f8f8f8,#eef2f7);border-bottom:1px solid #ddd;z-index:10}
#hp-bar,#shield-bar{flex:1;height:14px;background:#e0e0e0;border-radius:7px;overflow:hidden;position:relative}
#hp-fill{height:100%;width:50%;background:linear-gradient(90deg,#4CAF50,#8BC34A);border-radius:7px;transition:width .3s}
#hp-fill.danger{background:linear-gradient(90deg,#f44336,#FF5722)}
#hp-text{font-size:11px;color:#555;min-width:36px;text-align:center}
#shield-fill{height:100%;width:0%;background:linear-gradient(90deg,#4FC3F7,#29B6F6);border-radius:7px;transition:width .5s}
#shield-text{font-size:11px;color:#555;min-width:36px;text-align:center}
#hp-label,#shield-label{font-size:10px;color:#888;min-width:20px}
#round-info{font-size:12px;color:#999;min-width:60px;text-align:right}
#wave-announce{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;font-size:20px;font-weight:bold;padding:18px 36px;border-radius:14px;z-index:20;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#wave-announce.show{opacity:1}
#wave-announce.hidden{display:none}
#game-overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .5s}
#game-overlay.show{opacity:1;pointer-events:auto}
.overlay-btn{padding:12px 36px;font-size:18px;font-weight:bold;border:none;border-radius:24px;cursor:pointer;margin:6px;transition:transform .2s}
.overlay-btn:active{transform:scale(.95)}
.overlay-btn.primary{background:linear-gradient(135deg,#4FC3F7,#29B6F6);color:#fff}
.overlay-btn.secondary{background:#fff;color:#333}

.fail-title{font-size:24px;font-weight:bold;color:#E53935;margin:12px 0}
.fail-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}

.product-card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 8px 32px rgba(0,0,0,.1);width:100%;max-width:320px;margin:16px 0}
.product-name{font-size:22px;font-weight:bold;color:#333;margin-bottom:4px}
.product-sub{font-size:14px;color:#999;margin-bottom:16px}
.product-features{text-align:left}
.feature-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.feature-item:last-child{border:none}
.feature-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feature-text{flex:1}
.feature-text strong{display:block;font-size:15px;color:#333}
.feature-text span{font-size:13px;color:#888}
.use-btn{display:inline-block;padding:16px 56px;background:linear-gradient(135deg,#29B6F6,#0288D1);color:#fff;font-size:22px;font-weight:bold;border:none;border-radius:32px;cursor:pointer;margin-top:20px;box-shadow:0 4px 20px rgba(41,182,246,.4);transition:transform .2s}
.use-btn:active{transform:scale(.95)}
#scene-product{padding:20px;text-align:center;background:linear-gradient(180deg,#E3F2FD 0%,#fff 100%)}
#scene-fail{justify-content:center;padding:30px;text-align:center;background:#2c2c3a}
#scene-success{justify-content:center;padding:30px;text-align:center}
.success-title{font-size:26px;font-weight:bold;color:#4CAF50;margin:12px 0}
.date-btn{padding:14px 48px;background:linear-gradient(135deg,#FF6B6B,#E53935);color:#fff;font-size:20px;font-weight:bold;border:none;border-radius:28px;cursor:pointer;margin-top:20px;box-shadow:0 4px 15px rgba(229,57,53,.3)}
#scene-dating{justify-content:center;padding:30px;text-align:center;background:linear-gradient(180deg,#FFF0F0 0%,#fff 100%)}
.dating-couple{display:flex;gap:20px;margin:20px 0;align-items:center;justify-content:center}
.dating-person{width:50px;height:80px;border-radius:25px 25px 12px 12px;position:relative}
.dating-person::before{content:'';position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%}
.dating-person.person-m{background:linear-gradient(180deg,#4FC3F7,#29B6F6)}
.dating-person.person-m::before{background:#FFE0BD}
.dating-person.person-w{background:linear-gradient(180deg,#FF6B6B,#E53935)}
.dating-person.person-w::before{background:#FFE0BD;border:2px solid #E53935}
.dating-sparkle{width:10px;height:10px;background:#FFD700;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:sparkleRotate 1.5s ease-in-out infinite}
@keyframes sparkleRotate{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.4) rotate(180deg);opacity:.7}}
#scene-brand{justify-content:center;padding:40px 30px;text-align:center;background:linear-gradient(135deg,#E3F2FD,#F3E5F5)}
.brand-slogan{font-size:28px;font-weight:900;color:#1A237E;margin:16px 0;letter-spacing:4px}
.brand-sub{font-size:16px;color:#666;margin-bottom:24px}
.buy-btn{display:inline-block;padding:14px 48px;background:linear-gradient(135deg,#FF6B6B,#E53935);color:#fff;font-size:18px;font-weight:bold;border:none;border-radius:28px;cursor:pointer;box-shadow:0 4px 15px rgba(229,57,53,.3);text-decoration:none;transition:transform .2s}
.buy-btn:active{transform:scale(.95)}

#manga-cutscene{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,10,.92);padding:20px;cursor:pointer}
.manga-bg{position:absolute;inset:0;background-image:repeating-radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:3px 3px;pointer-events:none}
.manga-panel{position:relative;width:310px;min-height:70px;margin:5px 0;border:3px solid #fff;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.manga-panel .panel-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:70px;position:relative}
.manga-speed-lines{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0,rgba(255,255,255,.18) 2px,transparent 4px);pointer-events:none}
.manga-radial-burst{position:absolute;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.4) 0,rgba(255,255,255,.1) 40%,transparent 70%);border-radius:50%;pointer-events:none}
.manga-figure{width:34px;height:66px;background:rgba(255,255,255,.25);border-radius:17px 17px 8px 8px;position:relative;z-index:1}
.manga-figure::before{content:'';position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:26px;height:26px;background:rgba(255,255,255,.3);border-radius:50%}
.manga-kanji{font-size:52px;font-weight:900;color:#fff;opacity:.6;position:relative;z-index:1;text-shadow:0 0 30px rgba(255,255,255,.15);line-height:1}
.manga-tooth{width:30px;height:44px;background:linear-gradient(180deg,#fff 0%,#f0ece4 70%,#f5d0b0 70%,#e8b890 100%);border-radius:6px 6px 2px 2px;position:relative;z-index:1;box-shadow:0 0 20px rgba(255,255,255,.3)}
.manga-steam{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:30px;pointer-events:none}
.manga-steam::before,.manga-steam::after{content:'';position:absolute;width:12px;height:20px;background:rgba(255,255,255,.2);border-radius:50%;animation:steamUp 2s ease-out infinite}
.manga-steam::before{left:4px;animation-delay:0s}
.manga-steam::after{right:4px;animation-delay:.7s}
@keyframes steamUp{0%{transform:translateY(0) scale(1);opacity:.4}100%{transform:translateY(-20px) scale(1.8);opacity:0}}
.manga-diamond{width:28px;height:28px;background:rgba(255,255,255,.35);transform:rotate(45deg);position:relative;z-index:1}
.manga-diamond::before{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;background:rgba(255,255,255,.15)}
.manga-catchphrase{font-size:30px;font-weight:900;color:#fff;text-align:center;line-height:1.3;margin:14px 0 6px;text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:2px}
.manga-dismiss-hint{font-size:12px;color:rgba(255,255,255,.3);margin-top:8px}
.manga-clean-bg{display:flex;align-items:center;justify-content:center;gap:8px}
.manga-clean-bg .manga-tooth{animation:toothGlow 1.5s ease-in-out infinite alternate}
@keyframes toothGlow{0%{box-shadow:0 0 10px rgba(255,255,255,.2)}100%{box-shadow:0 0 30px rgba(255,255,255,.5)}}
.manga-sparkle-group{position:absolute;inset:0;pointer-events:none}
.manga-sparkle-dot{position:absolute;width:6px;height:6px;background:#FFD700;border-radius:50%;animation:dustTwinkle 1.2s ease-in-out infinite alternate}
@keyframes dustTwinkle{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:.8}}



.fluoride-shield{position:absolute;top:585px;left:50%;transform:translateX(-50%);width:32px;height:32px;z-index:3;display:none;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#4FC3F7;background:rgba(79,195,247,.25);border-radius:50%;border:2px solid rgba(79,195,247,.5);box-shadow:0 0 12px rgba(79,195,247,.3)}
.fluoride-shield.active{display:flex}
.clear-lane-btn{position:absolute;top:668px;z-index:3;width:30px;height:30px;font-size:0;color:#fff;background:linear-gradient(135deg,#FF8A65,#FF7043);border:none;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(255,138,101,.4);transition:opacity .3s;display:none}
.clear-lane-btn:active{transform:scale(.88)}
.clear-lane-btn.cooldown{opacity:.3;pointer-events:none}
.clear-lane-btn.cl0{left:38px}
.clear-lane-btn.cl1{left:172px}
.clear-lane-btn.cl2{left:307px}
#heal-btn{position:absolute;top:668px;left:72px;z-index:3;width:30px;height:30px;font-size:0;color:#fff;background:linear-gradient(135deg,#81C784,#4CAF50);border:none;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(129,199,132,.5);display:none;animation:healPulse 1.2s ease-in-out infinite}
#heal-btn:active{transform:scale(.88)}
#heal-btn2{position:absolute;top:704px;left:72px;z-index:3;width:30px;height:30px;font-size:0;color:#fff;background:linear-gradient(135deg,#66BB6A,#388E3C);border:none;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(56,142,60,.5);display:none;animation:healPulse2 .8s ease-in-out infinite}
#heal-btn2:active{transform:scale(.88)}
@keyframes healPulse{0%,100%{box-shadow:0 2px 8px rgba(129,199,132,.5)}50%{box-shadow:0 2px 16px rgba(129,199,132,.9)}}
@keyframes healPulse2{0%,100%{box-shadow:0 2px 8px rgba(56,142,60,.5);transform:scale(1)}50%{box-shadow:0 2px 20px rgba(56,142,60,.9);transform:scale(1.08)}}
#remind-btn{position:absolute;top:672px;left:10px;z-index:4;width:20px;height:20px;font-size:12px;font-weight:bold;color:#fff;background:#E53935;border:none;border-radius:50%;cursor:pointer;display:none;opacity:.8}
#remind-btn:hover{opacity:1}
#remind-btn.pulse{animation:remindPulse 1.2s ease-in-out infinite}
@keyframes remindPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
#lane-hint{position:absolute;top:644px;left:50%;transform:translateX(-50%);z-index:3;font-size:11px;color:#FF8A65;background:rgba(255,138,101,.12);padding:2px 12px;border-radius:8px;white-space:nowrap;display:none;opacity:0;transition:opacity 2s}
#lane-hint.show{opacity:1}

#scene-fail .fail-castle{display:flex;gap:8px;justify-content:center;margin:16px 0}
#scene-fail .fail-tooth{width:34px;height:60px;background:linear-gradient(180deg,#c0b8a0 0%,#a09880 60%,#e08060 60%,#c06050 100%);border-radius:6px 6px 2px 2px;filter:grayscale(.4)}
#scene-fail .fail-tooth:nth-child(2){transform:rotate(6deg)}
#scene-fail .fail-tooth:nth-child(3){transform:rotate(-4deg)}
#scene-fail .broken-flag{font-size:30px;margin:8px 0;opacity:.5}

#scene-success .success-teeth{display:flex;gap:8px;justify-content:center;margin:16px 0}
#scene-success .s-tooth{width:38px;height:64px;background:linear-gradient(180deg,#fff 0%,#f8f4ec 70%,#f8d8c8 70%,#f0c8b0 100%);border-radius:8px 8px 2px 2px;box-shadow:0 0 12px rgba(255,255,255,.6),0 0 30px rgba(129,199,132,.3);animation:successGlow 1.8s ease-in-out infinite alternate}
#scene-success .s-tooth:nth-child(2){animation-delay:.3s}
#scene-success .s-tooth:nth-child(3){animation-delay:.6s}
@keyframes successGlow{0%{box-shadow:0 0 8px rgba(255,255,255,.3)}100%{box-shadow:0 0 25px rgba(129,199,132,.5)}}

@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}

@media(max-width:375px){#app{width:100vw;height:100vh}}
@media(min-width:376px) and (max-width:420px){#app{width:100vw;height:100vh}}
</style>
</head>
<body>
<div id="app">
  <div id="scene-container"></div>
  <div id="game-wrapper" style="display:none">
    <canvas id="gameCanvas"></canvas>
    <div id="game-hud">
      <div id="hp-label">HP</div>
      <div id="hp-bar"><div id="hp-fill"></div></div>
      <div id="hp-text">50/100</div>
      <div id="shield-label">SD</div>
      <div id="shield-bar"><div id="shield-fill"></div></div>
      <div id="shield-text">0</div>
      <div id="round-info">第 <span id="round-num">1</span> 轮</div>
    </div>
    <div id="wave-announce" class="hidden"></div>
    <div id="game-overlay"></div>
    <div id="manga-cutscene" class="hidden"></div>
    <div class="fluoride-shield" id="shield-indicator">氟</div>
    <button id="heal-btn">修复</button>
    <button id="heal-btn2">急救</button>
    <button class="clear-lane-btn cl0" data-lane="0"></button>
    <button class="clear-lane-btn cl1" data-lane="1"></button>
    <button class="clear-lane-btn cl2" data-lane="2"></button>
    <button id="remind-btn">!</button>
    <div id="lane-hint">点击清除细菌</div>
  </div>
</div>
<script>
const CONFIG = {
  CANVAS_WIDTH: 375,
  CANVAS_HEIGHT: 550,
  LANES: [{x:65,label:'left'},{x:190,label:'middle'},{x:315,label:'right'}],
  CASTLE_Y: 460,
  TOOTH_W: 110,
  TOOTH_H: 70,
  TOOTH_GAP: 6,
  BUBBLE_SPEED: 6,
  BUBBLE_RADIUS: 10,
  BUBBLE_ATTACK: 1,
  FIRE_COOLDOWN: 400,
  ENEMY_SPAWN_Y: -40,
  BUBBLE_SPAWN_Y: 535,
  CASTLE_START_HP: 50,
  CASTLE_MAX_HP: 100,
  BASE_SHIELD: 200,
  ENEMIES: {
    yellow:{name:'表层牙渍',hp:1,atk:10,speed:.8,color:'#F5C842',radius:12,stainColor:'#C49A2A',stainType:'yellow'},
    purple:{name:'敏感细菌',hp:2,atk:20,speed:1.2,color:'#9B59B6',radius:14,stainColor:'#7D3C98',stainType:'purple'},
    black:{name:'深层细菌',hp:5,atk:30,speed:1.6,color:'#2C3E50',radius:16,stainColor:'#1A252F',stainType:'black'}
  },
  WAVES:[
    {enemies:[{type:'yellow',lane:0,delay:200},{type:'yellow',lane:1,delay:800},{type:'purple',lane:0,delay:1500},{type:'yellow',lane:2,delay:2200},{type:'yellow',lane:0,delay:3000},{type:'purple',lane:1,delay:3800},{type:'yellow',lane:1,delay:4600},{type:'purple',lane:2,delay:5400},{type:'yellow',lane:2,delay:6200},{type:'purple',lane:0,delay:7000}],announcement:'是表层牙渍！'},
    {enemies:[{type:'yellow',lane:0,delay:300},{type:'purple',lane:1,delay:1200},{type:'purple',lane:2,delay:2200},{type:'yellow',lane:0,delay:3200},{type:'black',lane:1,delay:4200},{type:'purple',lane:2,delay:5200},{type:'yellow',lane:1,delay:6200},{type:'purple',lane:0,delay:7200},{type:'black',lane:1,delay:8200},{type:'purple',lane:2,delay:9200}],announcement:'是敏感细菌！'},
    {enemies:[{type:'purple',lane:0,delay:300},{type:'black',lane:1,delay:1500},{type:'purple',lane:2,delay:2800},{type:'black',lane:0,delay:4100},{type:'yellow',lane:1,delay:5400},{type:'purple',lane:2,delay:6700},{type:'black',lane:1,delay:8000},{type:'black',lane:0,delay:9300},{type:'purple',lane:1,delay:10600},{type:'black',lane:2,delay:12000}],announcement:'是深层细菌，它们潜藏在最里面，小心！'}
  ],
  PASSIVE_DRAIN_RATE: .8
};

const ASSETS = {
  useImages: false,
  basePath: 'assets/',
  cache: {},
  draw(ctx,name,x,y,w,h){
    return true;
  }
};

const BGM = {
  ctx:null,gain:null,playing:false,_timer:null,
  start(){
    if(this.playing){
      if(this._timer){clearTimeout(this._timer);this._timer=null}
      this._scheduleLoop();
      return;
    }
    try{
      this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      this.gain=this.ctx.createGain();this.gain.gain.value=.15;
      this.gain.connect(this.ctx.destination);
      this.playing=true;
      this._scheduleLoop();
    }catch(e){}
  },
  stop(){
    this.playing=false;
    if(this._timer){clearTimeout(this._timer);this._timer=null}
    if(this.ctx){this.ctx.close();this.ctx=null}
  },
  _scheduleLoop(){
    if(!this.playing)return;
    const notes=[262,294,330,392,440,523,587,659];
    const seq=[0,2,4,7,  4,2,1,0,  2,4,5,7,  4,2,1,0];
    const dur=.2;const total=seq.length*dur;
    seq.forEach((ni,i)=>{
      const t=this.ctx.currentTime+i*dur;
      const osc=this.ctx.createOscillator();const g=this.ctx.createGain();
      osc.type='square';osc.frequency.value=notes[ni];
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*.9);
      osc.connect(g);g.connect(this.gain);osc.start(t);osc.stop(t+dur);
      const osc2=this.ctx.createOscillator();const g2=this.ctx.createGain();
      osc2.type='triangle';osc2.frequency.value=notes[Math.max(0,ni-2)];
      g2.gain.setValueAtTime(.08,t);g2.gain.exponentialRampToValueAtTime(.001,t+dur*.8);
      osc2.connect(g2);g2.connect(this.gain);osc2.start(t);osc2.stop(t+dur);
    });
    for(let b=0;b<4;b++){
      const t=this.ctx.currentTime+b*dur*4;
      const osc=this.ctx.createOscillator();const g=this.ctx.createGain();
      osc.type='sine';osc.frequency.value=131;
      g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*3.8);
      osc.connect(g);g.connect(this.gain);osc.start(t);osc.stop(t+dur*4);
    }
    for(let b=0;b<16;b++){
      const t=this.ctx.currentTime+b*dur;
      const osc=this.ctx.createOscillator();const g=this.ctx.createGain();
      osc.type='triangle';osc.frequency.value=800+Math.random()*400;
      g.gain.setValueAtTime(b%2?.04:.08,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*.05);
      osc.connect(g);g.connect(this.gain);osc.start(t);osc.stop(t+dur*.05);
    }
    this._timer=setTimeout(()=>this._scheduleLoop(),total*1000-50);
  }
};

const SFX = {
  ctx(){return BGM.ctx||(BGM.ctx=new(window.AudioContext||window.webkitAudioContext)());},
  playWin(){
    const c=this.ctx(),g=c.createGain();g.gain.value=.15;g.connect(c.destination);
    [523,659,784,1047].forEach((f,i)=>{
      const o=c.createOscillator(),gg=c.createGain();
      o.type='sine';o.frequency.value=f;
      const t=c.currentTime+i*.15;
      gg.gain.setValueAtTime(.12,t);gg.gain.exponentialRampToValueAtTime(.001,t+.6);
      o.connect(gg);gg.connect(g);o.start(t);o.stop(t+.6);
    });
  },
  playLose(){
    const c=this.ctx(),g=c.createGain();g.gain.value=.18;g.connect(c.destination);
    [494,440,370,294].forEach((f,i)=>{
      const o=c.createOscillator(),gg=c.createGain();
      o.type='sawtooth';o.frequency.value=f;
      const t=c.currentTime+i*.2;
      gg.gain.setValueAtTime(.15,t);gg.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(gg);gg.connect(g);o.start(t);o.stop(t+.5);
    });
  }
};

<script>

  canvas:null,ctx:null,round:1,state:'idle',

  currentWave:-1,waveSpawnTimer:0,waveSpawnIndex:0,waveActive:false,allWavesDone:false,

    this._clearLaneCooldowns=[0,0,0];
    const clBtns=document.querySelectorAll('.clear-lane-btn');
    if(this._clearLaneHandlers)clBtns.forEach(b=>b.removeEventListener('click',this._clearLaneHandlers[b.dataset.lane]));
    this._clearLaneHandlers=[];
    clBtns.forEach(b=>{
      const li=parseInt(b.dataset.lane);
      const h=()=>{
        if(this._clearLaneCooldowns[li]>0||this.state==='cutscene')return;
        const before=this.enemies.length;
        this.enemies=this.enemies.filter(e=>e.lane!==li||(e.alive=false));
        for(const e of this.enemies)if(e.lane===li){e.alive=false;this.spawnKillEffect(e.x,e.y,'#fff')}
        this.enemies=this.enemies.filter(e=>e.alive);
        if(this.enemies.length<before)this.showFloatingText('灭火要快 姿势要帅','#FF8A65',true);
        this._clearLaneCooldowns[li]=4000;b.classList.add('cooldown');
        document.getElementById('remind-btn').classList.remove('pulse');
      };
      this._clearLaneHandlers[li]=h;
      b.addEventListener('click',h);
    });
    const rBtn=document.getElementById('remind-btn');
    if(this._remindHandler)rBtn.removeEventListener('click',this._remindHandler);
    this._remindHandler=()=>{this.showFloatingText('点击下方红色圆形按钮可清除一路细菌！','#FF8A65')};
    rBtn.addEventListener('click',this._remindHandler);
    const healBtn=document.getElementById('heal-btn');
    const healBtn2=document.getElementById('heal-btn2');
    const doHeal=(btn)=>{
      if(this.state==='cutscene')return;
      this.state='cutscene';
      MangaCutscene.show('heal',()=>{
        this.state='playing';
        this.castle.hp=this.castle.maxHp;
        this.castle.shield=CONFIG.BASE_SHIELD;
        this._shieldWasBroken=false;
        this.castle.yellowStain=0;
        this.castle.purpleStain=0;
        this.castle.blackStain=0;
        document.getElementById('shield-indicator').classList.add('active');
        this.showFloatingText('修复完成','#81C784');
        this.updateHUD();
      });
      btn.style.display='none';
    };
    if(this._healHandler)healBtn.removeEventListener('click',this._healHandler);
    this._healHandler=()=>doHeal(healBtn);
    healBtn.addEventListener('click',this._healHandler);
    if(this._healHandler2)healBtn2.removeEventListener('click',this._healHandler2);
    this._healHandler2=()=>doHeal(healBtn2);
    healBtn2.addEventListener('click',this._healHandler2);
    if(this.animId)cancelAnimationFrame(this.animId);
    this.lastTs=performance.now();
    this.showAnnouncement(0);
    this.loop(this.lastTs);
  },

  handleClick(e){
    if(this.state==='won'||this.state==='lost'||this.state==='cutscene')return;
    e.preventDefault();
    const rect=this.canvas.getBoundingClientRect();
    let cx,cy;
    if(e.touches){cx=e.touches[0].clientX;cy=e.touches[0].clientY}
    else{cx=e.clientX;cy=e.clientY}
    const x=(cx-rect.left)*(this.canvas.width/rect.width);
    const y=(cy-rect.top)*(this.canvas.height/rect.height);
    const now=performance.now();
    if(now-this.lastFireTime<CONFIG.FIRE_COOLDOWN)return;
    for(let i=this.powerups.length-1;i>=0;i--){
      const p=this.powerups[i];
      if(Math.hypot(x-p.x,y-p.y)<30){
        this.activatePowerup(p);
        this.powerups.splice(i,1);
        this.lastFireTime=now;
        return;
      }
    }
    const lane=this.getLaneAt(x);
    this.lastFireTime=now;
    this.fireBubble(lane);
  },

  getLaneAt(x){
    const ls=CONFIG.LANES;
    let md=Infinity,ni=1;
    for(let i=0;i<ls.length;i++){const d=Math.abs(x-ls[i].x);if(d<md){md=d;ni=i}}
    return ni;
  },

  fireBubble(l){
    const ln=CONFIG.LANES[l];
    this.bubbles.push({x:ln.x,y:CONFIG.BUBBLE_SPAWN_Y,lane:l,speed:CONFIG.BUBBLE_SPEED,radius:CONFIG.BUBBLE_RADIUS,life:1});
  },

  showAnnouncement(wi){
    if(wi>=CONFIG.WAVES.length){this.allWavesDone=true;this.state='playing';return}
    const w=CONFIG.WAVES[wi],el=document.getElementById('wave-announce');
    el.textContent=w.announcement;
    el.classList.remove('hidden','show');void el.offsetWidth;el.classList.add('show');
    this.state='announcing';this.waveActive=false;
    setTimeout(()=>{
      el.classList.remove('show');el.classList.add('hidden');
      this.state='playing';this.waveActive=true;
      this.currentWave=wi;this.waveSpawnIndex=0;this.waveSpawnTimer=0;
    },1800);
  },

  loop(ts){
    if(this.state==='won'||this.state==='lost'){this.render();return}
    const dt=Math.min(ts-this.lastTs,33);this.lastTs=ts;
    this.update(dt);this.render();
    this.animId=requestAnimationFrame((t)=>this.loop(t));
  },

  update(dt){
    if(this.state==='announcing'||this.state==='won'||this.state==='lost'||this.state==='cutscene')return;
    if(this.state==='playing'){
      if(this.waveActive&&this.currentWave<CONFIG.WAVES.length)this.updateSpawning(dt);
      this.updateEnemies(dt);
      this.updateBubbles(dt);
      this.checkCollisions();
      this.updatePowerups(dt);
      if(this.round===2&&this.castle.shield<=0&&!this._shieldWasBroken){this._shieldWasBroken=true;document.getElementById('heal-btn2').style.display='block'}
      for(let i=0;i<3;i++){if(this._clearLaneCooldowns[i]>0){this._clearLaneCooldowns[i]-=dt;if(this._clearLaneCooldowns[i]<=0){this._clearLaneCooldowns[i]=0;document.querySelector('.clear-lane-btn.cl'+i).classList.remove('cooldown')}}}
      this.checkWaveComplete();
      if(this.round===1&&this.allWavesDone&&this.castle.hp>0&&!this.waveActive){
        this.castle.hp=Math.max(0,this.castle.hp-CONFIG.PASSIVE_DRAIN_RATE*(dt/16));
        this.updateHUD();
      }
      this.checkGameOver();
    }
  },

  updateSpawning(dt){
    const w=CONFIG.WAVES[this.currentWave];
    if(!w||this.waveSpawnIndex>=w.enemies.length)return;
    this.waveSpawnTimer+=dt;
    const ed=w.enemies[this.waveSpawnIndex];
    if(this.waveSpawnTimer>=ed.delay){
      this.spawnEnemy(ed);
      this.waveSpawnIndex++;
      if(this.waveSpawnIndex>=w.enemies.length)this.waveActive=false;
    }
  },

  spawnEnemy(d){
    const t=CONFIG.ENEMIES[d.type];
    if(!t)return;
    const ln=CONFIG.LANES[d.lane];
    const sm=this.round===2?.9:1;
    const hm=this.round===2?.8:1;
    this.enemies.push({
      x:ln.x,y:CONFIG.ENEMY_SPAWN_Y,lane:d.lane,
      type:d.type,hp:Math.ceil(t.hp*hm),maxHp:Math.ceil(t.hp*hm),
      atk:t.atk,speed:t.speed*sm,color:t.color,radius:t.radius,
      stainColor:t.stainColor,stainType:t.stainType,alive:true,reachedCastle:false
    });
  },

  updateEnemies(dt){
    for(const e of this.enemies){
      if(!e.alive)continue;
      e.y+=e.speed*(dt/16);
      if(e.y>=CONFIG.CASTLE_Y-10){
        e.alive=false;e.reachedCastle=true;
        this.damageCastle(e);
      }
    }
    this.enemies=this.enemies.filter(e=>e.alive);
  },

  updateBubbles(dt){
    for(const b of this.bubbles){
      if(b.isEffect)continue;
      b.y-=b.speed*(dt/16);
      b.life-=.02*(dt/16);
    }
    this.bubbles=this.bubbles.filter(b=>(b.isEffect||b.y>-20)&&b.life>0);
  },

  checkCollisions(){
    for(const b of this.bubbles){
      if(b.life<=0)continue;
      for(const e of this.enemies){
        if(!e.alive||b.lane!==e.lane)continue;
        if(Math.hypot(b.x-e.x,b.y-e.y)<b.radius+e.radius){
          e.hp-=CONFIG.BUBBLE_ATTACK;
          b.life=0;
          if(e.hp<=0){e.alive=false;this.spawnKillEffect(e.x,e.y,e.color)}
          break;
        }
      }
    }
    this.bubbles=this.bubbles.filter(b=>b.life>0);
    this.enemies=this.enemies.filter(e=>e.alive);
  },

  spawnKillEffect(x,y,c){
    for(let i=0;i<5;i++){
      this.bubbles.push({
        x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,
        radius:3,life:.5,isEffect:true,color:c
      });
    }
  },

  damageCastle(e){
    let d=e.atk;
    let shieldBroke=false;
    if(this.castle.shield>0){
      if(this.castle.shield>=d){this.castle.shield-=d;d=0}
      else{d-=this.castle.shield;this.castle.shield=0;shieldBroke=true}
    }else{shieldBroke=true}
    if(d>0){this.castle.hp-=d;this.castle.totalDamage+=d}
    if(shieldBroke){
      switch(e.stainType){
        case'yellow':this.castle.yellowStain=Math.min(this.castle.yellowStain+15,100);break;
        case'purple':this.castle.purpleStain=Math.min(this.castle.purpleStain+25,100);break;
        case'black':this.castle.blackStain=Math.min(this.castle.blackStain+35,100);break;
      }
    }
    this.updateHUD();
  },

  updatePowerups(dt){
    for(const p of this.powerups){
      p.fallTimer+=dt;
      if(p.fallTimer<3000){p.y+=.8*(dt/16);if(p.y>CONFIG.CASTLE_Y+CONFIG.TOOTH_H-16)p.y=CONFIG.CASTLE_Y+CONFIG.TOOTH_H-16}
      p.pulsePhase+=.05*(dt/16);
    }
  },

  checkWaveComplete(){
    if(this.waveActive)return;
    if(this.allWavesDone){
      if(this.enemies.length===0&&this.bubbles.filter(b=>!b.isEffect).length===0)this.onGameWin();
      return;
    }
    if(this.currentWave>=0&&!this.waveActive&&this.waveSpawnIndex>=CONFIG.WAVES[this.currentWave].enemies.length&&this.enemies.length===0)this.onWaveComplete();
  },

  onWaveComplete(){
    const wi=this.currentWave,nw=wi+1;
    setTimeout(()=>{
      if(nw<CONFIG.WAVES.length)this.showAnnouncement(nw);
      else{this.allWavesDone=true;this.state='playing';if(this.enemies.length===0)this.onGameWin()}
    },1000);
  },

  activatePowerup(p){
    if(this.state==='cutscene')return;
    this.state='cutscene';
    MangaCutscene.show('heal',()=>{
      this.state='playing';
      this.castle.hp=this.castle.maxHp;
      this.castle.yellowStain=0;
      this.castle.purpleStain=0;
      this.castle.blackStain=0;
      this.showFloatingText('修复完成','#81C784');
      this.updateHUD();
    });
  },

  showFloatingText(t,c,rnd){
    const el=document.createElement('div');
    el.textContent=t;
    const x=rnd?(10+Math.random()*75)+'%':'50%';
    const y=rnd?(20+Math.random()*60)+'%':'50%';
    el.style.cssText='position:absolute;left:'+x+';top:'+y+';transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:'+c+';pointer-events:none;z-index:25;text-shadow:0 2px 8px rgba(0,0,0,0.3);animation:floatUp 1s ease-out forwards;';
    document.getElementById('game-wrapper').appendChild(el);
    setTimeout(()=>el.remove(),1000);
  },

  checkGameOver(){
    if(this._gameOverTriggered)return;
    if(this.castle.hp<=0){
      this.castle.hp=0;this.updateHUD();
      this._gameOverTriggered=true;
      setTimeout(()=>this.onGameLose(),500);
    }
  },

  onGameLose(){
    if(this.state==='lost')return;
    this.state='lost';
    BGM.stop();
    SFX.playLose();
    if(this.animId){cancelAnimationFrame(this.animId);this.animId=null}
    SceneManager.showGameResult('lose');
  },

  onGameWin(){
    if(this.state==='won'||this.state==='lost')return;
    this.state='won';
    BGM.stop();
    SFX.playWin();
    if(this.animId){cancelAnimationFrame(this.animId);this.animId=null}
    if(this.round===1){this.onGameLose();return}
    setTimeout(()=>{SceneManager.showGameResult('win')},800);
  },

  updateHUD(){
    const hp=Math.max(0,(this.castle.hp/this.castle.maxHp)*100);
    const f=document.getElementById('hp-fill');
    f.style.width=hp+'%';
    f.classList.toggle('danger',hp<30);
    document.getElementById('hp-text').textContent=Math.max(0,this.castle.hp)+'/'+this.castle.maxHp;
    const sp=Math.min(100,(this.castle.shield/CONFIG.BASE_SHIELD)*100);
    document.getElementById('shield-fill').style.width=sp+'%';
    document.getElementById('shield-text').textContent=Math.max(0,this.castle.shield);
    document.getElementById('round-num').textContent=this.round;
  },

  render(){
    const ctx=this.ctx,w=CONFIG.CANVAS_WIDTH,h=CONFIG.CANVAS_HEIGHT;
    ctx.clearRect(0,0,w,h);
    this.renderBackground(ctx,w,h);
    this.renderLanes(ctx);
    this.renderEnemies(ctx);
    this.renderBubbles(ctx);
    this.renderCastle(ctx);
    this.renderPowerups(ctx);
  },

  renderBackground(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#e8f0f8');g.addColorStop(.5,'#f5f8fa');g.addColorStop(1,'#f0ece4');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(200,220,240,0.1)';
    for(const l of CONFIG.LANES){ctx.fillRect(l.x-30,0,60,CONFIG.CASTLE_Y)}
  },

  renderLanes(ctx){
    ctx.strokeStyle='rgba(180,195,210,0.25)';
    ctx.lineWidth=1;ctx.setLineDash([5,7]);
    for(const l of CONFIG.LANES){
      ctx.beginPath();
      ctx.moveTo(l.x,0);ctx.lineTo(l.x,CONFIG.CASTLE_Y-5);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  },

  renderCastle(ctx){
    const cy=CONFIG.CASTLE_Y,tw=CONFIG.TOOTH_W,th=CONFIG.TOOTH_H;
    for(let i=0;i<3;i++){
      const lx=CONFIG.LANES[i].x,tx=lx-tw/2;
      const yi=this.castle.yellowStain/100;
      const pi=this.castle.purpleStain/100;
      const bi=this.castle.blackStain/100;
      const bb=255-bi*180;
      ctx.fillStyle='rgb('+Math.round(bb-yi*25)+','+Math.round(bb-yi*10)+','+Math.round(bb-yi*60)+')';
      ctx.beginPath();ctx.roundRect(tx,cy-10,tw,th,[5,5,2,2]);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=1;ctx.stroke();
      if(yi>0){ctx.fillStyle='rgba(180,130,40,'+(.25*yi)+')';ctx.beginPath();ctx.roundRect(tx+3,cy-6,tw-6,th*.35,3);ctx.fill()}
      if(pi>0){ctx.fillStyle='rgba(155,89,182,'+(.2*pi)+')';ctx.beginPath();ctx.roundRect(tx+3,cy+th-22,tw-6,18,3);ctx.fill()}
      if(bi>0){ctx.fillStyle='rgba(0,0,0,'+(.2*bi)+')';ctx.beginPath();ctx.roundRect(tx+2,cy-6,tw-4,th*.45,3);ctx.fill()}
    }
    const gumY=cy+th-10;
    const gumX=CONFIG.LANES[0].x-tw/2-4;
    const gumW=CONFIG.LANES[2].x+tw/2+4-gumX;
    const pi=this.castle.purpleStain/100;
    const gR=Math.round(200+55*Math.random()+pi*55);
    const gG=Math.round(160-pi*50);
    const gB=Math.round(160-pi*50);
    ctx.fillStyle='rgb('+gR+','+gG+','+gB+')';
    ctx.beginPath();ctx.roundRect(gumX,gumY,gumW,12,[2,2,0,0]);ctx.fill();
    if(this.castle.shield>0){
      ctx.save();
      ctx.shadowColor='#4FC3F7';ctx.shadowBlur=25+Math.sin(performance.now()*.003)*8;
      ctx.strokeStyle='rgba(79,195,247,0.35)';ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(5,CONFIG.CASTLE_Y-30,365,110,12);
      ctx.stroke();
      ctx.restore();
    }
  },

  renderEnemies(ctx){
    for(const e of this.enemies){
      if(!e.alive)continue;
      this.drawEnemy(ctx,e);
    }
  },

  drawEnemy(ctx,e){
    ctx.save();
    ctx.translate(e.x,e.y);
    const r=e.radius;
    ctx.shadowColor='rgba(0,0,0,0.12)';ctx.shadowBlur=4;
    if(e.type==='yellow'){
      ctx.fillStyle=e.color;
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const a=(i/12)*Math.PI*2,rd=r+(i%2===0?2:-2);
        const px=Math.cos(a)*rd,py=Math.sin(a)*rd;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(140,100,30,0.35)';
      ctx.beginPath();ctx.arc(-3,-4,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-2,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(-1,5,2,0,Math.PI*2);ctx.fill();
    }else if(e.type==='purple'){
      ctx.fillStyle=e.color;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2-Math.PI/2;
        const rd=r+Math.sin(i*2.3)*3;
        const px=Math.cos(a)*rd,py=Math.sin(a)*rd;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.beginPath();ctx.arc(-3,-3,5,0,Math.PI*2);ctx.fill();
    }else if(e.type==='black'){
      ctx.fillStyle=e.color;
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const a=(i/12)*Math.PI*2-Math.PI/2;
        const rd=r+(i%2===0?5:-1);
        const px=Math.cos(a)*rd,py=Math.sin(a)*rd;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#E74C3C';
      ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();ctx.arc(-1,-1,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    if(e.maxHp>1){
      const bw=e.radius*2+4,bh=3;
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.fillRect(e.x-bw/2,e.y-e.radius-8,bw,bh);
      ctx.fillStyle='#4CAF50';
      ctx.fillRect(e.x-bw/2,e.y-e.radius-8,bw*(e.hp/e.maxHp),bh);
    }
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(e.x-3,e.y-4,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.x+3,e.y-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(50,50,50,0.6)';
    ctx.beginPath();ctx.arc(e.x-3,e.y-4,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.x+3,e.y-4,1.5,0,Math.PI*2);ctx.fill();
  },

  renderBubbles(ctx){
    for(const b of this.bubbles){
      if(b.isEffect){
        ctx.globalAlpha=b.life*2;
        ctx.fillStyle=b.color||'#fff';
        ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();
        b.x+=b.vx||0;b.y+=b.vy||0;b.life-=.03;
        ctx.globalAlpha=1;
        continue;
      }
      ctx.save();
      ctx.shadowColor='rgba(180,210,240,0.5)';ctx.shadowBlur=10;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(180,210,240,0.3)';
      ctx.beginPath();ctx.arc(b.x-2,b.y-2,b.radius*.35,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  },

  renderPowerups(ctx){
    for(const p of this.powerups){
      const pu=Math.sin(p.pulsePhase)*.08+1,rd=22*pu;
      ctx.save();
      ctx.shadowColor=p.config.color;ctx.shadowBlur=18;
      ctx.strokeStyle=p.config.color;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(p.x,p.y,rd,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=p.config.color+'33';
      ctx.beginPath();ctx.arc(p.x,p.y,rd-2,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';
      const symbol=p.type==='clearLane'?'\u26A1':'\u2728';
      ctx.fillText(symbol,p.x,p.y);
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='10px sans-serif';
      ctx.textAlign='center';ctx.fillText(p.config.name,p.x,p.y-rd-10);
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='9px sans-serif';
      ctx.fillText('\u70B9\u51FB\u62FE\u53D6',p.x,p.y+rd+12);
    }
  }
};
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rs=Array.isArray(r)?r:[r,r,r,r];
    const [tl,tr,bl,br]=rs.length===4?rs:[rs[0],rs[0],rs[0],rs[0]];
    this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br);
    this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+br,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-br);
    this.lineTo(x,y+tl);
    this.quadraticCurveTo(x,y,x+tl,y);this.closePath();
  };
}
</script>
